<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task on forms</title>
    <style>
        body {
            background-color: tomato;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1{
            margin: 50px 0 50px 0;
        }
        form{
            background-color: rgb(242, 135, 116);
            padding: 50px;
            border: none;
            border-radius: 50px;
        }
        
    </style>
</head>
<body>
    <h1><strong>Application Form</strong></h1>
        
    <form action="" style="color: black"><br>
        <label for="">First Name :</label>
        <input type="text">

        <label for="">Last Name :</label>
        <input type="text"><br><br>

        <label for="">Date of Birth :</label>
        <input type="date">

        <label for="">Age :</label>
        <input type="number"><br><br>

        <label for="gender">Gender:</label>
<select id="gender" name="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
</select>
        

        <label for="email">Email Address :</label>
        <input type="email" placeholder="Enter email address"><br><br>

        <label for="">Posotion Available:</label>
        <input type="radio" name="Posotion Available">Junior Developer
        <input type="radio"name="Posotion Available">Mid-levl Developer
        <input type="radio"name="Posotion Available">Senior Developer<br><br>

        <label for="">Programming Languages:</label>
        <input type="checkbox">Java
        <input type="checkbox">JavaScript
        <input type="checkbox">Python
        <br><br>

        <label for="">Password:</label>
        <input type="password">

        <label for="">Confirm Password:</label>
        <input type="password"><br><br>

        <button type="submit">submit</button>
        <button type="reset">Reset</button>
    </form>
    
</body>
</html>
