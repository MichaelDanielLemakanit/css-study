<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar task</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        body{
            background-image: url(bg.png);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .sidebar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 100px 0 1px;
            text-decoration: none;
        }
        .sidebar a{
            text-decoration: none;
            color: white;
            padding: 0 10px 0 40px;
        }
        .sidebar .list{
            list-style: none;
            text-decoration: none;
            display: flex;
            padding: 0 10px 0 38px;
        }
        .heading{
            color: aliceblue;
            font-family: 'Times New Roman', Times, serif;
            font-size: 40px;
        }
        h1{
            margin: 100px 0 50px 80px;
        }
        p{
            color: rgb(168, 210, 245);
            font-size: 12px;
            margin: 10px 0 30px 170px;
        }
        button{
            background-color: rgb(93, 196, 243);
            color: rgb(216, 229, 240);
            font-size: 20px;
            border: none;
            border-radius: 190px;
            padding: 8px 30px 8px 30px;
            margin: 0 160px 0 ;
        }
        div p::before{
            content:"" ;
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background-color: rgb(151, 42, 42);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <ul class="list">
            <i class="fa-solid fa-bars" style="color: white;"></i>
            
                <li><a href="#Home" data-after="Home">Home</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">About</a></li>
            </ul>
            <a>Contact us</a>
        </div>
        <di class="heading">
            <h1>
                Simple <br>Web Design
            </h1>
        </di>
           <div>
            <p>
                Lorem ipsum dolor sit amet consectetur <br>adipisicing elit. Debitis iusto eveniet harum cumque corporis <br>maiores illum adipisci beatae enim ex atque, maxime est nostrum quaerat <br>alias minus omnis nihil dolorum?
            </p>
        <button>
            Portfolio
        </button>
           </div>
        <div class="image">

        </div>
    </div>
</body>
</html>
